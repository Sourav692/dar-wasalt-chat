# Golden questions for the retrieval eval (evals/retrieval_eval.py) and, later, the LLM judge.
#
# A question is a hit when any of its top-5 chunks satisfies its expectation:
#   urls:    the chunk URL contains any of these fragments (a trailing $ means "ends with")
#   listing: the chunk is a listing whose meta matches every key/value given
# answerable: false marks questions the corpus cannot answer; they are scored by the judge,
# not by hit@5.

